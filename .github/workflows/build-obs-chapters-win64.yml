name: Build OBS Hybrid MP4 chapter navigation (Windows x64)

on:
  push:
    branches:
      - obs-hybrid-mp4-chapters
    paths:
      - '.gitmodules'
      - '.github/workflows/build-obs-chapters-win64.yml'
      - '.devcontainer_mxe64/**'
      - 'avidemux/**'
      - 'avidemux_core/**'
      - 'avidemux_plugins/**'
      - 'bootStrapCrossMingwQt6_2026.sh'
      - 'mxe_scan_deps.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare build log
        run: |
          printf 'Avidemux OBS Hybrid MP4 chapters - Windows x64 build\n' > build-win64.log
          printf 'Commit: %s\n' "$GITHUB_SHA" >> build-win64.log
          printf 'Started: %s\n' "$(date -u)" >> build-win64.log

      - name: Pull prebuilt MXE toolchain image
        id: prebuilt-mxe
        continue-on-error: true
        run: docker pull avidemux/avidemux_mxe:latest

      - name: Set up Docker Buildx
        if: steps.prebuilt-mxe.outcome != 'success'
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Qt prerequisite stage
        if: steps.prebuilt-mxe.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer_mxe64
          file: .devcontainer_mxe64/Dockerfile
          target: mxe-qt-deps
          tags: avidemux/avidemux_mxe:qt-deps
          load: true
          cache-from: type=gha,scope=avidemux-mxe-qt-deps
          cache-to: type=gha,mode=max,scope=avidemux-mxe-qt-deps

      - name: Build final MXE toolchain image
        if: steps.prebuilt-mxe.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer_mxe64
          file: .devcontainer_mxe64/Dockerfile
          target: final
          tags: avidemux/avidemux_mxe:latest
          load: true
          cache-from: type=gha,scope=avidemux-mxe-qt-deps
          cache-to: type=gha,mode=max,scope=avidemux-mxe-qt-deps

      - name: Build Avidemux using the MXE toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            avidemux/avidemux_mxe:latest \
            bash -lc 'trap '\''for f in /tmp/logbuildMingw*; do if [ -f "$f" ]; then echo "===== $f =====" >> /workspace/build-win64.log; cat "$f" >> /workspace/build-win64.log; fi; done'\'' EXIT; set -o pipefail; bash ./bootStrapCrossMingwQt6_2026.sh 2>&1 | tee -a build-win64.log'

      - name: Package portable Windows build
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f avidemux64/avidemux.exe
          (cd avidemux64 && zip -qr ../Avidemux-OBS-Hybrid-Chapters-win64.zip .)
          sha256sum Avidemux-OBS-Hybrid-Chapters-win64.zip | tee Avidemux-OBS-Hybrid-Chapters-win64.sha256

      - name: Upload build files and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-obs-hybrid-chapters-win64
          path: |
            Avidemux-OBS-Hybrid-Chapters-win64.zip
            Avidemux-OBS-Hybrid-Chapters-win64.sha256
            build-win64.log
          if-no-files-found: warn
          retention-days: 7
